name: Deploy v4 to hosting

on:
  push:
    branches:
      - main
    paths:
      - 'v4/**'
      - '.github/workflows/deploy-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Upload site and team photos
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          REMOTE="$SSH_USER@$SSH_HOST"
          REMOTE_DIR='/var/www/korona'
          SSH_OPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o LogLevel=VERBOSE)

          sshpass -p "$SSH_PASSWORD" ssh "${SSH_OPTS[@]}" -p "$SSH_PORT" "$REMOTE" "
            set -e
            test -f '$REMOTE_DIR/index.html'
            mkdir -p /root/backups/korona '$REMOTE_DIR/img'
            cp '$REMOTE_DIR/index.html' \"/root/backups/korona/index-\$(date +%Y%m%d%H%M%S).html\"
          "

          sshpass -p "$SSH_PASSWORD" scp "${SSH_OPTS[@]}" -P "$SSH_PORT" \
            v4/index.html \
            "$REMOTE:$REMOTE_DIR/index.html"
          sshpass -p "$SSH_PASSWORD" scp "${SSH_OPTS[@]}" -P "$SSH_PORT" \
            v4/img/team-zakhar.webp \
            v4/img/team-elena-generated.webp \
            v4/img/team-nelya-generated.webp \
            "$REMOTE:$REMOTE_DIR/img/"

      - name: Verify published page
        run: |
          curl -fsSL --max-time 30 https://koronabmb.ru/ -o /tmp/korona-live.html
          grep -q '10 лет подбираем всё для безупречного сна' /tmp/korona-live.html
          grep -q 'https://t.me/koronabmb56' /tmp/korona-live.html
          grep -q 'team-zakhar.webp' /tmp/korona-live.html
          curl -fsSL --max-time 30 -o /dev/null https://www.koronabmb.ru/
          echo 'Live site updated successfully'
