name: Deploy v4 to hosting

on:
  push:
    branches:
      - main
    paths:
      - 'v4/**'
      - '.github/workflows/deploy-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload site and team photos
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          ftp_run() {
            lftp -u "$FTP_USER,$FTP_PASSWORD" -e "
              set cmd:fail-exit yes
              set net:timeout 20
              set net:max-retries 1
              set ftp:ssl-allow yes
              open ftp://$FTP_HOST
              $1
              bye
            "
          }

          REMOTE_DIR=''
          for dir in '/data/www/sovetowww.fvds.ru' '/www/sovetowww.fvds.ru' '/sovetowww.fvds.ru' '/public_html' '/'; do
            if ftp_run "cd $dir; cls index.html" >/tmp/korona-ftp-check.log 2>&1; then
              REMOTE_DIR="$dir"
              break
            fi
          done
          if [ -z "$REMOTE_DIR" ]; then
            cat /tmp/korona-ftp-check.log
            echo 'Site document root not found'
            exit 1
          fi
          echo 'Site document root found'

          ftp_run "cd $REMOTE_DIR; get index.html -o /tmp/korona-index-backup.html"
          ftp_run "cd $REMOTE_DIR; put v4/index.html -o index.html; mkdir -p img"
          ftp_run "cd $REMOTE_DIR/img; put v4/img/team-zakhar.webp -o team-zakhar.webp; put v4/img/team-elena-generated.webp -o team-elena-generated.webp; put v4/img/team-nelya-generated.webp -o team-nelya-generated.webp"

      - name: Verify published page
        run: |
          curl -fsSL --max-time 30 http://sovetowww.fvds.ru/ -o /tmp/korona-live.html
          grep -q '10 лет подбираем всё для безупречного сна' /tmp/korona-live.html
          grep -q 'https://t.me/koronabmb56' /tmp/korona-live.html
          grep -q 'team-zakhar.webp' /tmp/korona-live.html
          echo 'Live site updated successfully'
